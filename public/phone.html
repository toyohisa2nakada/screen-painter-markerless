<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Screen Painter - phone</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: #eee; font: 14px system-ui, sans-serif; overflow: hidden; overscroll-behavior: none; }
  #wrap { position: fixed; inset: 0; }
  #video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #bar { position: absolute; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px 8px; background: rgba(0,0,0,0.55); display: flex; gap: 10px; align-items: center; }
  #status { flex: 1; font-size: 13px; color: #9cf; }
  button { background: #2b3446; color: #eee; border: 1px solid #456; border-radius: 6px; padding: 8px 14px; font-size: 14px; }
  #start { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 18px; padding: 16px 28px; }
  #hint { position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); left: 0; right: 0; text-align: center; color: #aaa; font-size: 12px; pointer-events: none; }
</style>
</head>
<body>
<div id="wrap">
  <video id="video" muted playsinline autoplay></video>
  <canvas id="overlay"></canvas>
  <div id="bar"><div id="status">準備中...</div><button id="clear">消去</button></div>
  <button id="start">カメラを開始</button>
  <div id="hint">画面をスマホで映しながら、この画面上をなぞると PC 画面に描かれます</div>
</div>
<script src="/vendor/peerjs/peerjs.min.js"></script>
<script src="/js/phone.js"></script>
</body>
</html>
