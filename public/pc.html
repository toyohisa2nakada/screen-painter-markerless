<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Screen Painter - PC (markerless)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: #ddd; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #screen { position: relative; aspect-ratio: 16 / 9; width: 100vw; max-height: 100vh; max-width: calc(100vh * 16 / 9); }
  #screen canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #paint, #hud { pointer-events: none; }
  #panel { position: absolute; top: 12px; right: 12px; width: 340px; background: rgba(20,24,32,0.92); border: 1px solid #334; border-radius: 8px; padding: 10px 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.5); }
  #panel.hidden { display: none; }
  #panel h1 { font-size: 14px; margin: 0 0 6px; }
  #status { color: #9cf; white-space: pre-wrap; }
  #qr { width: 150px; height: 150px; background: #fff; border-radius: 4px; padding: 4px; }
  #qrwrap { display: flex; gap: 10px; align-items: flex-start; margin: 8px 0; }
  #qrwrap div { font-size: 12px; word-break: break-all; }
  /* #debug { width: 100%; background: #111; border-radius: 4px; display: block; } */
  #debug { width: auto; height: auto; max-width: 100%; max-height: 30vh; background: #111; border-radius: 4px; display: block; margin: 0 auto; }
  #stats { font-family: ui-monospace, monospace; font-size: 11px; white-space: pre; color: #bbb; margin-top: 6px; }
  .row { display: flex; gap: 8px; align-items: center; margin: 4px 0; flex-wrap: wrap; }
  label { user-select: none; }
  input[type=range] { width: 110px; }
  button { background: #2b3446; color: #eee; border: 1px solid #456; border-radius: 4px; padding: 3px 8px; cursor: pointer; }
  button:hover { background: #3a4660; }
  #toggle { position: absolute; top: 12px; right: 12px; z-index: 10; opacity: 0.6; }
  #toggle:hover { opacity: 1; }
</style>
</head>
<body>
<div id="stage">
  <div id="screen">
    <canvas id="game" width="1280" height="720"></canvas>
    <canvas id="paint" width="1280" height="720"></canvas>
    <canvas id="hud" width="1280" height="720"></canvas>
  </div>
</div>
<button id="toggle" title="パネル表示切替 (D)">panel</button>
<div id="panel">
  <h1>Screen Painter - markerless</h1>
  <div id="status">initialising...</div>
  <div id="qrwrap"><img id="qr" alt="QR"><div>スマホでこのQRを開く:<br><span id="phoneUrl"></span></div></div>
  <canvas id="debug" width="320" height="240"></canvas>
  <div id="stats"></div>
  <div class="row">
    <label><input type="checkbox" id="texture" checked> 背景テクスチャ</label>
    <label><input type="checkbox" id="showDebug" checked> デバッグ描画</label>
    <button id="clear">ストローク消去</button>
  </div>
  <div class="row">
    <label>映像遅延補正 <input type="range" id="latency" min="0" max="300" value="80"> <span id="latencyV">80</span> ms</label>
  </div>
  <div class="row">
    <label>最小inlier <input type="range" id="minInl" min="8" max="80" value="20"> <span id="minInlV">20</span></label>
    <label>平滑化 <input type="range" id="smooth" min="0" max="95" value="50"> <span id="smoothV">50</span>%</label>
  </div>
</div>
<script src="/vendor/peerjs/peerjs.min.js"></script>
<script src="/js/xfeat.js"></script>
<script src="/js/homography.js"></script>
<script src="/js/matcher.js"></script>
<script src="/js/demo-game.js"></script>
<script src="/js/pc.js"></script>
</body>
</html>
